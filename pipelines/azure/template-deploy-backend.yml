parameters:
  - name: azureSubscription
    type: string

  - name: environment
    type: string

  - name: resourceGroup
    type: string

  - name: appName
    type: string

  - name: projectFolderName
    type: string

  - name: withStageSlot
    type: boolean
    default: true

  - name: pingEndpoints
    type: object
    default: []

  - name: maxPingRetries
    type: number
    default: 3

  - name: certificateSecureFile
    type: string
    default: ''

  - name: certificatePassword
    type: string
    default: ''

jobs:
  # Deploy with stage slot (blue-green deployment)
  - ${{ if eq(parameters.withStageSlot, true) }}:
      - job: StartStageJob
        displayName: Start Stage
        steps:
          - checkout: none

          - task: AzureAppServiceManage@0
            displayName: Start Stage
            inputs:
              azureSubscription: ${{ parameters.azureSubscription }}
              Action: Start Azure App Service
              WebAppName: ${{ parameters.appName }}
              SpecifySlotOrASE: true
              ResourceGroupName: ${{ parameters.resourceGroup }}
              Slot: stage

      - deployment: DeployStageJob
        dependsOn: StartStageJob
        displayName: Deploy to ${{ parameters.environment }}
        environment: ${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  displayName: Download the build artifacts
                  inputs:
                    buildType: current
                    downloadType: single
                    artifactName: ${{ parameters.projectFolderName }}
                    downloadPath: $(System.DefaultWorkingDirectory)

                - task: AzureRmWebAppDeployment@4
                  displayName: Deploy to Stage
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    WebAppName: ${{ parameters.appName }}
                    deployToSlotOrASE: true
                    ResourceGroupName: ${{ parameters.resourceGroup }}
                    SlotName: stage
                    packageForLinux: $(System.DefaultWorkingDirectory)/${{ parameters.projectFolderName }}/${{ parameters.projectFolderName }}.zip
                    enableCustomDeployment: true
                    DeploymentType: runFromZip

      - job: PingStageJob
        dependsOn: DeployStageJob
        displayName: Ping Stage ${{ parameters.appName }}
        steps:
          - checkout: none

          - template: ../general/helpers/template-ping-host.yml
            parameters:
              hostUrl: https://${{ parameters.appName }}-stage.azurewebsites.net
              pingEndpoints: ${{ parameters.pingEndpoints }}
              pingType: Cloud
              maxRetries: ${{ parameters.maxPingRetries }}
              certificateSecureFile: ${{ parameters.certificateSecureFile }}
              certificatePassword: ${{ parameters.certificatePassword }}

      - job: SwapSlotsAndStopStageJob
        dependsOn: PingStageJob
        displayName: Swap Slots and Stop Stage
        steps:
          - checkout: none

          - task: AzureAppServiceManage@0
            displayName: Swap Slots Stage with Production
            inputs:
              azureSubscription: ${{ parameters.azureSubscription }}
              Action: Swap Slots
              WebAppName: ${{ parameters.appName }}
              ResourceGroupName: ${{ parameters.resourceGroup }}
              SourceSlot: stage

          - task: AzureAppServiceManage@0
            displayName: Stop Stage
            inputs:
              azureSubscription: ${{ parameters.azureSubscription }}
              Action: Stop Azure App Service
              WebAppName: ${{ parameters.appName }}
              SpecifySlotOrASE: true
              ResourceGroupName: ${{ parameters.resourceGroup }}
              Slot: stage

      - job: PingJob
        dependsOn: SwapSlotsAndStopStageJob
        displayName: Ping ${{ parameters.appName }}
        steps:
          - checkout: none

          - template: ../general/helpers/template-ping-host.yml
            parameters:
              hostUrl: https://${{ parameters.appName }}.azurewebsites.net
              pingEndpoints: ${{ parameters.pingEndpoints }}
              pingType: Cloud
              maxRetries: ${{ parameters.maxPingRetries }}
              certificateSecureFile: ${{ parameters.certificateSecureFile }}
              certificatePassword: ${{ parameters.certificatePassword }}

  # Deploy directly to production (no stage slot)
  - ${{ if eq(parameters.withStageSlot, false) }}:
      - deployment: DeployProductionJob
        displayName: Deploy to ${{ parameters.environment }}
        environment: ${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@1
                  displayName: Download the build artifacts
                  inputs:
                    buildType: current
                    downloadType: single
                    artifactName: ${{ parameters.projectFolderName }}
                    downloadPath: $(System.DefaultWorkingDirectory)

                - task: AzureRmWebAppDeployment@4
                  displayName: Deploy to Production
                  inputs:
                    azureSubscription: ${{ parameters.azureSubscription }}
                    WebAppName: ${{ parameters.appName }}
                    ResourceGroupName: ${{ parameters.resourceGroup }}
                    packageForLinux: $(System.DefaultWorkingDirectory)/${{ parameters.projectFolderName }}/${{ parameters.projectFolderName }}.zip
                    enableCustomDeployment: true
                    DeploymentType: runFromZip

      - job: PingJob
        dependsOn: DeployProductionJob
        displayName: Ping ${{ parameters.appName }}
        steps:
          - checkout: none

          - template: ../general/helpers/template-ping-host.yml
            parameters:
              hostUrl: https://${{ parameters.appName }}.azurewebsites.net
              pingEndpoints: ${{ parameters.pingEndpoints }}
              pingType: Cloud
              maxRetries: ${{ parameters.maxPingRetries }}
              certificateSecureFile: ${{ parameters.certificateSecureFile }}
              certificatePassword: ${{ parameters.certificatePassword }}

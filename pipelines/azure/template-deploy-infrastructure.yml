parameters:
  environment: ""
  serviceConnection: ""
  resourceGroup: ""
  entrypointScriptPath: "iac/iac-entrypoint.ps1"
  personalAccessToken: ""

jobs:
  - job: DeployInfrastructureJob
    displayName: Deploy ${{ parameters.resourceGroup }}
    pool:
      vmImage: "ubuntu-latest"

    steps:
      - checkout: self
        clean: true
        lfs: false
        submodules: false
        path: self
        persistCredentials: false
        target: host

      - task: AzureCLI@2
        displayName: Deploy ${{ parameters.resourceGroup }}
        name: DeployInfrastructureTask
        inputs:
          azureSubscription: ${{ parameters.serviceConnection }}
          scriptType: pscore
          scriptLocation: scriptPath
          scriptPath: ${{ parameters.entrypointScriptPath }}
          arguments: >
            -environment ${{ parameters.environment }}
            -personalAccessToken ${{ parameters.personalAccessToken }}

parameters:
  - name: environment
    type: string

  - name: serviceConnection
    type: string

  - name: resourceGroup
    type: string

  - name: personalAccessToken
    type: string

  - name: entrypointScriptPath
    type: string
    default: iac/entrypoint.ps1

jobs:
  - job: DeployInfrastructureJob
    displayName: Deploy ${{ parameters.resourceGroup }}
    steps:
      - checkout: self
        clean: true
        lfs: false
        submodules: false
        path: self
        persistCredentials: false
        target: host

      - task: AzureCLI@2
        displayName: Deploy ${{ parameters.resourceGroup }}
        name: DeployInfrastructureTask
        inputs:
          azureSubscription: ${{ parameters.serviceConnection }}
          scriptType: pscore
          scriptLocation: scriptPath
          scriptPath: ${{ parameters.entrypointScriptPath }}
          arguments: >
            -environment ${{ parameters.environment }}
            -personalAccessToken ${{ parameters.personalAccessToken }}

parameters:
  - name: templateRepoAlias
    type: string

jobs:
  - job: Job
    displayName: Get Pull Request ID
    steps:
      - checkout: ${{ parameters.templateRepoAlias }}
        path: templates

      - task: PowerShell@2
        displayName: Get Pull Request ID
        name: Task
        inputs:
          targetType: filePath
          filePath: $(Pipeline.Workspace)/templates/pipelines/release/scripts/get-pullrequest-id.ps1
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

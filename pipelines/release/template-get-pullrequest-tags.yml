parameters:
  - name: templateRepoAlias
    type: string

  - name: pullRequestId
    type: string

jobs:
  - job: GetPullRequestTagsJob
    displayName: Get Pull Request Tags
    condition: not(or(failed(), canceled()))
    steps:
      - checkout: ${{ parameters.templateRepoAlias }}
        path: templates

      - task: PowerShell@2
        displayName: Get Pull Request Tags
        name: Task
        inputs:
          targetType: filePath
          filePath: $(Pipeline.Workspace)/templates/pipelines/release/scripts/get-pullrequest-tags.ps1
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          PULLREQUEST_ID: ${{ parameters.pullRequestId }}

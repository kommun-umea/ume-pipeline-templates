parameters:
  - name: templateRepoAlias
    type: string

  - name: producerJob
    type: string

  - name: outputVariable
    type: string

jobs:
  - job: Job
    displayName: Get Valid Release Tag
    dependsOn: ${{ parameters.producerJob }}
    condition: not(or(failed(), canceled()))
    variables:
      releaseTags: $[ dependencies.${{ parameters.producerJob }}.outputs['Task.${{ parameters.outputVariable }}'] ]
    steps:
      - checkout: ${{ parameters.templateRepoAlias }}
        path: templates

      - task: PowerShell@2
        displayName: Get Valid Release Tag
        name: Task
        inputs:
          targetType: filePath
          filePath: $(Pipeline.Workspace)/templates/pipelines/release/scripts/get-valid-release-tag.ps1
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          RELEASE_TAGS: $(releaseTags)

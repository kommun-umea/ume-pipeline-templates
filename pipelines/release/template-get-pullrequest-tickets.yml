parameters:
  - name: templateRepoAlias
    type: string

  - name: pullRequestId
    type: string

jobs:
  - job: GetPullRequestTicketsJob
    displayName: Get Pull Request Tickets
    condition: not(or(failed(), canceled()))
    steps:
      - checkout: ${{ parameters.templateRepoAlias }}
        path: templates

      - task: PowerShell@2
        displayName: Get Pull Request Tickets
        name: Task
        inputs:
          targetType: filePath
          filePath: $(Pipeline.Workspace)/templates/pipelines/release/scripts/get-pullrequest-tickets.ps1
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          PULLREQUEST_ID: ${{ parameters.pullRequestId }}

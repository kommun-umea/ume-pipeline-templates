name: $(buildName)_$(Date:yyyy-MM-ddTHH.mm.ss)

# This pipeline is triggered by DevOps Build Validation feature
# Project Settings > Repositories > [repo] > Policies > [branch] > Build Validation
trigger: none

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
    - repository: templates
      type: git
      name: Turkos/ume-pipeline-templates
      ref: $(Build.SourceBranch)

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: prod
    values:
      - prod

variables:
  - template: general/template-default-pipeline-variables.yml
    parameters:
      environment: ${{ parameters.environment }}

stages:
  - stage: ValidateReleaseTagStage
    displayName: Validate Pull Request
    condition: eq(variables['Build.Reason'], 'PullRequest')
    jobs:
      - template: release/template-get-valid-release-tag-from-pullrequest.yml
        parameters:
          templateRepoAlias: templates
          pullRequestId: $(System.PullRequest.PullRequestId)

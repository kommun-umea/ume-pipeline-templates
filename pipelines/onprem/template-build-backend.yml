parameters:
  - name: templateRepoAlias
    type: string

  - name: destinationPath
    type: string

  - name: projectFolderName
    type: string

  - name: entrypointProjectName
    type: string

  - name: variableGroup
    type: string

  - name: projectParentFolderPath
    type: string
    default: src

  - name: buildConfiguration
    type: string
    default: Release
    values:
      - Debug
      - Release

  - name: shouldTest
    type: boolean
    default: true

  - name: shouldPublish
    type: boolean
    default: true

  - name: shouldUpdateAppsettings
    type: boolean
    default: true

jobs:
  - job: BuildBackendJob
    displayName: Build Backend
    steps:
      - template: ../general/template-build-backend.yml
        parameters:
          projectFolderName: ${{ parameters.projectFolderName }}
          entrypointProjectName: ${{ parameters.entrypointProjectName }}
          projectParentFolderPath: ${{ parameters.projectParentFolderPath }}
          buildConfiguration: ${{ parameters.buildConfiguration }}
          shouldTest: ${{ parameters.shouldTest }}
          shouldPublish: ${{ parameters.shouldPublish }}

      - task: CopyFiles@2
        displayName: Publish artifact to temp folder
        condition: |
          and(
            succeeded(),
            eq(${{ parameters.shouldPublish }}, true)
          )
        inputs:
          SourceFolder: $(Build.ArtifactStagingDirectory)
          TargetFolder: ${{ parameters.destinationPath }}/temp
          CleanTargetFolder: true

  - job: UpdateAppsettingsJob
    displayName: Update appsettings.json
    dependsOn: BuildBackendJob
    condition: |
      and(
        succeeded(),
        eq(${{ parameters.shouldPublish }}, true),
        eq(${{ parameters.shouldUpdateAppsettings }}, true)
      )
    steps:
      - checkout: ${{ parameters.templateRepoAlias }}
        path: templates

      - task: PowerShell@2
        displayName: Update appsettings.json
        inputs:
          targetType: filePath
          filePath: $(Pipeline.Workspace)/templates/pipelines/onprem/scripts/update-appsettings.ps1
          arguments: |
            -variableGroup "${{ parameters.variableGroup }}" `
            -zipFilePath "${{ parameters.destinationPath }}/temp/${{ parameters.projectFolderName }}.zip" `
            -personalAccessToken "$(System.AccessToken)"

name: $(buildName)_$(Date:yyyy-MM-ddTHH.mm.ss)

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
    - repository: templates
      type: git
      name: Turkos/ume-pipeline-templates
      ref: $(Build.SourceBranch)

variables:
  - template: general/template-default-pipeline-variables.yml
    parameters:
      environment: prod

  - template: release/template-release-orchestrator-variables.yml

  - name: templateRepoAlias
    value: templates

stages:
  - stage: ValidateRequestStage
    displayName: Validate Request
    jobs:
      - template: general/template-fail-on-condition.yml
        parameters:
          failCondition: >-
            and(
              eq(variables['isSourceMain'], true),
              eq(variables['Build.Reason'], 'Manual')
            )
          errorMessage: Manual releases from latest commit on main is not allowed. Use release tag instead.

  - stage: GetPullRequestIdStage
    displayName: Get Pull Request Id
    condition: eq(variables['isNewRelease'], true)
    jobs:
      - template: release/template-get-pullrequest-id.yml
        parameters:
          templateRepoAlias: ${{ variables.templateRepoAlias }}

  - stage: GetReleaseTagStage
    displayName: Get Release Tag
    dependsOn: GetPullRequestIdStage
    condition: >-
      and(
        eq(variables['isNewRelease'], true),
        not(or(failed(), canceled()))
      )
    variables:
      pullRequestId: $[ stageDependencies.GetPullRequestIdStage.Job.outputs['Task.PULLREQUEST_ID'] ]
    jobs:
      - template: release/template-get-valid-release-tag-from-pullrequest.yml
        parameters:
          templateRepoAlias: ${{ variables.templateRepoAlias }}
          pullRequestId: $(pullRequestId)

  - stage: InitializeReleaseStage
    displayName: Initialize Release
    dependsOn:
      - GetReleaseTagStage
      - GetPullRequestIdStage
    condition: >-
      and(
        eq(variables['isNewRelease'], true),
        not(or(failed(), canceled()))
      )
    variables:
      releaseTag: $[ stageDependencies.GetReleaseTagStage.Job.outputs['Task.RELEASE_TAG'] ]
      pullRequestId: $[ stageDependencies.GetPullRequestIdStage.Job.outputs['Task.PULLREQUEST_ID'] ]
    jobs:
      - template: release/template-initialize-release.yml
        parameters:
          templateRepoAlias: ${{ variables.templateRepoAlias }}
          pullRequestId: $(pullRequestId)
          tag: $(releaseTag)

  - stage: FinalizeReleaseStage
    displayName: Finalize Release
    dependsOn:
      - GetReleaseTagStage
      - GetPullRequestIdStage
      - InitializeReleaseStage
    condition: eq(variables['isNewRelease'], true)
    variables:
      releaseTag: $[ stageDependencies.GetReleaseTagStage.Job.outputs['Task.RELEASE_TAG'] ]
      pullRequestId: $[ stageDependencies.GetPullRequestIdStage.Job.outputs['Task.PULLREQUEST_ID'] ]
      deploymentJobResult: 'Succeeded'
    jobs:
      - template: release/template-finalize-release.yml
        parameters:
          templateRepoAlias: ${{ variables.templateRepoAlias }}
          pullRequestId: $(pullRequestId)
          tag: $(releaseTag)
          deploymentBuildId: $(Build.BuildId)
          deploymentFinishedDate: $(System.PipelineStartTime)

parameters:
  - name: hostUrl
    type: string

  - name: pingEndpoint
    type: string

  - name: pingType
    type: string
    default: Default
    values:
      - Default
      - Cloud
      - Internal
      - External

  - name: maxRetries
    type: number
    default: 3

  - name: retryDelay
    type: number
    default: 5

  - name: certificatePath
    type: string
    default: ''

  - name: certificatePassword
    type: string
    default: ''

steps:
  - powershell: |
      $pingUrl = "${{ parameters.hostUrl}}${{ parameters.pingEndpoint }}"
      Write-Host "Pinging $pingUrl"
      $maxRetries = ${{ parameters.maxRetries }}
      $retryDelay = ${{ parameters.retryDelay }}
      $success = $false

      $certificatePath = $env:CERT_PATH
      $certificatePassword = $env:CERT_PASSWORD
      $cert = $null

      if ($certificatePath -ne '') {
        Write-Host "Using client certificate for authentication..."
        $securePassword = ConvertTo-SecureString -String $certificatePassword -Force -AsPlainText
        $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($certificatePath, $securePassword)
      }

      for ($i = 1; $i -le $maxRetries; $i++) {
        try {
          if ($i -ne 1) {
            Write-Host "Retrying in $($retryDelay)s..."
            Start-Sleep -Seconds $retryDelay
          }

          $requestParams = @{
            Uri            = $pingUrl
            UseBasicParsing = $true
            TimeoutSec     = 10
          }

          if ($cert) {
            $requestParams['Certificate'] = $cert
          }

          $response = Invoke-WebRequest @requestParams -Verbose
          if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 300) {
            Write-Host "Ping successful!"
            $success = $true
            break
          }
        }
        catch {
          Write-Host "Ping failed on attempt #$i."
          Write-Warning $_
        }
      }

      if (-not $success) {
        Write-Host "##vso[task.setvariable variable=PingFailed]true"
        Write-Host "##vso[task.setvariable variable=${{ parameters.pingType }}PingFailed]true"
        Write-Error "Ping failed after $maxRetries attempts."
      }
    displayName: Ping ${{ parameters.pingType}} ${{ parameters.pingEndpoint }}
    env:
      CERT_PATH: ${{ parameters.certificatePath }}
      CERT_PASSWORD: ${{ parameters.certificatePassword }}
    failOnStderr: true
    condition: |
      and(
        succeeded(),
        ne(variables['${{ parameters.pingType }}PingFailed'], 'true')
      )
